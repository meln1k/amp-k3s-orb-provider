# Rebuilds the microVM worker image from Substrate's source and checks it is byte-for-byte the
# image provider-patch.yaml pins and ghcr.io serves. On main it also attests the digest, so
#   gh attestation verify oci://<pinned image> --repo meln1k/amp-k3s-orb-provider
# shows this workflow built it. The weekly run catches a changed image on the registry.
name: worker-image

on:
  push:
    branches: [main]
    paths: [microvm/**, .github/workflows/worker-image.yml]
  pull_request:
    paths: [microvm/**, .github/workflows/worker-image.yml]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBSTRATE_COMMIT: dc2bfeae63b43c65572400f65dcc98b974c290db
  GO_VERSION: 1.27.3
  KO_VERSION: v0.19.1
  CRANE_VERSION: v0.22.1

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned image
        id: pin
        run: |
          ref=$(grep -o 'ghcr\.io/[^"]*/ateworker-microvm@sha256:[0-9a-f]\{64\}' microvm/provider-patch.yaml)
          test "$(echo "$ref" | wc -l)" = 1
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=${ref%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The commit is on no branch, so fetch it by hash. No tags: Go stamps the module version
      # from git, and Substrate's tags change it.
      - name: Fetch Substrate
        run: |
          mkdir substrate && cd substrate && git init -q
          git fetch -q --no-tags --depth 1 https://github.com/agent-substrate/substrate "$SUBSTRATE_COMMIT"
          git checkout -q FETCH_HEAD

      - name: Build
        id: build
        working-directory: substrate
        env:
          IMAGE: ${{ steps.pin.outputs.name }}
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/ko@$KO_VERSION"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-containerregistry/cmd/crane@$CRANE_VERSION"
          out=$(GOFLAGS= KO_DOCKER_REPO="${IMAGE%/ateworker-microvm}" "$RUNNER_TEMP/bin/ko" build \
            ./cmd/ateworker-microvm -B --platform=linux/amd64 --push=false \
            --oci-layout-path=/tmp/ateworker-oci)
          echo "digest=${out#*@}" >> "$GITHUB_OUTPUT"

      - name: Compare with the pin and the registry
        env:
          PINNED: ${{ steps.pin.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
          REF: ${{ steps.pin.outputs.ref }}
        run: |
          served=$("$RUNNER_TEMP/bin/crane" digest "$REF")
          tagged=$("$RUNNER_TEMP/bin/crane" digest "${REF%@*}:$SUBSTRATE_COMMIT")
          echo "pinned $PINNED"
          echo "built  $BUILT"
          echo "served $served"
          echo "tag    $tagged"
          test "$BUILT" = "$PINNED" || { echo "::error::rebuild does not match the pinned digest"; exit 1; }
          test "$served" = "$PINNED" || { echo "::error::ghcr.io does not serve the pinned digest"; exit 1; }
          test "$tagged" = "$PINNED" || { echo "::error::the $SUBSTRATE_COMMIT tag moved"; exit 1; }

      - name: Attest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.pin.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
