# Inside the cluster, the apps' names resolve to Traefik's ClusterIP instead of its tailnet IP,
# which pods cannot reach. That includes orbs: their DNS and their egress gateway both use
# CoreDNS, so an agent reaches https://crm.apps.example.com through Traefik, with the same
# certificate as you. K3s's CoreDNS imports the *.server keys of this ConfigMap as server blocks;
# this one answers every name in the zone with the address of Traefik's Service. install.sh
# replaces apps.example.com with APPS_DOMAIN.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  apps.server: |
    apps.example.com:53 {
      errors
      cache 30
      rewrite name regex .* traefik.traefik.svc.cluster.local answer auto
      forward . 127.0.0.1:53
    }
