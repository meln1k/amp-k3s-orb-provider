# Optional: run schedules for apps. GoKubeDownscaler scales a Deployment in the apps namespace
# to zero outside its `downscaler/uptime` (or inside its `downscaler/downtime`) and back, such as
#   kubectl -n apps annotate deploy/crm downscaler/uptime="Mon-Fri 08:00-20:00 Europe/Berlin"
# It only sees the apps namespace, never amp-orbs.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-downscaler
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: apps-downscaler
  namespace: kube-system
spec:
  repo: https://caas-team.github.io/helm-charts/
  chart: go-kube-downscaler
  version: 1.4.3
  targetNamespace: kube-downscaler
  valuesContent: |-
    constrainedNamespaces: [apps]
    includedResources: [deployments, statefulsets, cronjobs]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
