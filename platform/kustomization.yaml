# Optional apps platform next to the orbs (README, Apps platform): `kubectl apply -k platform`,
# then `kubectl apply -k platform/certs` once cert-manager is running.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml
  - tailscale.yaml
  - traefik.yaml
  - coredns-custom.yaml
  - apps.yaml
  - registry.yaml
  - buildkit.yaml
  # - downscaler.yaml # run schedules for apps
