# The apps platform next to the orbs (docs/reference.md, Apps platform). install.sh applies it with
# apps.example.com replaced by APPS_DOMAIN, then certs/ once cert-manager is running.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cert-manager.yaml
  - tailscale.yaml
  - traefik.yaml
  - coredns-custom.yaml
  - apps.yaml
  - registry.yaml
  - buildkit.yaml
  # - downscaler.yaml # run schedules for apps
