# The apps' wildcard certificate from Let's Encrypt, proven over DNS-01: cert-manager writes a TXT
# record through your DNS provider's API, so nothing has to be reachable from the internet. This
# uses Cloudflare; for another provider, replace the solver
# (https://cert-manager.io/docs/configuration/acme/dns01/). Replace apps.example.com with your
# apps' domain (README, Apps platform).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # No email: Let's Encrypt no longer sends expiry notices, and cert-manager renews by itself.
    privateKeySecretRef: {name: letsencrypt-account}
    solvers:
    - selector:
        dnsZones: [apps.example.com]
      dns01:
        cloudflare:
          # Created by hand in the cert-manager namespace (README, Apps platform).
          apiTokenSecretRef: {name: cloudflare-api-token, key: api-token}
---
# One level of subdomains: crm.apps.example.com, not a.crm.apps.example.com.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: traefik
spec:
  secretName: wildcard-tls
  dnsNames: [apps.example.com, "*.apps.example.com"]
  issuerRef: {kind: ClusterIssuer, name: letsencrypt}
