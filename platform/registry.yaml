# The apps' image registry, inside the cluster only. BuildKit pushes to it by its Service name,
# and every node's containerd pulls from its fixed ClusterIP over plain HTTP, set in
# /etc/rancher/k3s/registries.yaml (README, Apps platform). Orbs cannot reach it: their egress
# gateway allows cleartext HTTP on ports 80, 8080, 8000 and 3000 only.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
      - name: registry
        image: registry:3.1.2
        ports: [{name: http, containerPort: 5000}]
        env:
        # Lets `regctl tag rm` and the like delete tags; disk is freed by the registry's
        # garbage-collect command (README, Apps platform).
        - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
        readinessProbe: {httpGet: {path: /v2/, port: http}}
        volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: registry}}]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  # Fixed, so that registries.yaml can name it. Kubernetes keeps the first 256 addresses of the
  # Service range (10.43.0.0/16 in K3s) for fixed IPs and hands them out at random only when the
  # rest is full.
  clusterIP: 10.43.0.50
  selector: {app: registry}
  ports: [{name: http, port: 5000, targetPort: http}]
