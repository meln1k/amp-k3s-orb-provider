# The apps' image registry, inside the cluster only. Agents push the images they build with Nix
# from their orbs to its Service name, on 8080 because orbs' egress gateway allows cleartext HTTP
# on ports 80, 8080, 8000 and 3000 only. Every node's containerd pulls from its fixed ClusterIP
# over plain HTTP, set in /etc/rancher/k3s/registries.yaml, which nixos.nix writes. It has no
# login: apps and tasks cannot reach it (their NetworkPolicies), and orbs are yours.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
  annotations:
    # On the apps machine only (nixos.nix): PodNodeSelector adds the selector, and
    # PodTolerationRestriction the toleration for its taint, to every pod here.
    scheduler.alpha.kubernetes.io/node-selector: amp-orbs/role=apps
    scheduler.alpha.kubernetes.io/defaultTolerations: '[{"key": "amp-orbs/apps", "operator": "Exists", "effect": "NoSchedule"}]'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
      - name: registry
        image: registry:3.1.2
        ports: [{name: http, containerPort: 5000}]
        env:
        # Lets `regctl tag rm` and the like delete tags; disk is freed by the registry's
        # garbage-collect command (docs/reference.md, Apps platform).
        - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
        readinessProbe: {httpGet: {path: /v2/, port: http}}
        volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: registry}}]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  # Fixed, so that registries.yaml can name it. Kubernetes keeps the first 256 addresses of the
  # Service range (10.43.0.0/16 in K3s) for fixed IPs and hands them out at random only when the
  # rest is full.
  clusterIP: 10.43.0.50
  selector: {app: registry}
  ports: [{name: http, port: 8080, targetPort: http}]
