# Traefik, the single entry point for every app. Its Service is a Tailscale LoadBalancer, so the
# operator gives it one tailnet device, and nothing listens on the LAN. K3s's helm-controller
# installs it at the version pinned here; keep K3s's own Traefik disabled (`--disable traefik`),
# so K3s upgrades do not change or replace it.
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  annotations:
    # On the apps machine only (nixos.nix): PodNodeSelector adds the selector, and
    # PodTolerationRestriction the toleration for its taint, to every pod here.
    scheduler.alpha.kubernetes.io/node-selector: amp-orbs/role=apps
    scheduler.alpha.kubernetes.io/defaultTolerations: '[{"key": "amp-orbs/apps", "operator": "Exists", "effect": "NoSchedule"}]'
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: apps-traefik # not "traefik": K3s owns that name for its bundled Traefik
  namespace: kube-system
spec:
  repo: https://traefik.github.io/charts
  chart: traefik
  version: 42.4.0
  targetNamespace: traefik
  valuesContent: |-
    fullnameOverride: traefik
    global:
      checkNewVersion: false
    deployment:
      replicas: 1
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
    providers:
      kubernetesCRD:
        # For github-ssh below. Only Traefik's own routes (IngressRouteTCP and the like), which
        # agents cannot create, may name an ExternalName Service; apps' Ingresses still cannot.
        allowExternalNameServices: true
    ingressClass:
      enabled: true
      isDefaultClass: true
      name: traefik
    ports:
      web:
        http:
          redirections:
            entryPoint: {to: websecure, scheme: https, permanent: true}
    service:
      annotations:
        # The device's name in the tailnet: k3s-apps.<tailnet>.ts.net.
        tailscale.com/hostname: k3s-apps
      spec:
        type: LoadBalancer
        loadBalancerClass: tailscale
        # A LoadBalancer Service also opens a NodePort on every node's LAN address by default;
        # without one, Traefik is reachable only through the Tailscale proxy (and in-cluster).
        allocateLoadBalancerNodePorts: false
    # Every app is served with the wildcard certificate (certs/letsencrypt.yaml), so an Ingress
    # needs no tls section and no Secret of its own.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-tls
---
# Temporary workaround, to be removed once the projects that still clone over SSH use HTTPS:
# SSH to GitHub for orbs, and to nothing else. Their egress gateway passes only TLS that names a
# server (and plain HTTP), so orbs wrap SSH in TLS to github-ssh.<apps' domain> (provider.nix
# sets that up in every orb); Traefik unwraps it with the wildcard certificate and relays the
# bytes to github.com:22. GitHub's host key is still checked end to end. Traefik runs on the apps
# machine, which must reach github.com:22.
apiVersion: v1
kind: Service
metadata:
  name: github-ssh
  namespace: traefik
spec:
  type: ExternalName
  externalName: github.com
  ports: [{name: ssh, port: 22, protocol: TCP}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: github-ssh
  namespace: traefik
spec:
  entryPoints: [websecure]
  routes:
  - match: HostSNI(`github-ssh.apps.example.com`)
    services: [{name: github-ssh, port: 22}]
  tls: {}
