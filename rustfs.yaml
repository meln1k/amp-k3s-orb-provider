# Single-node S3 for paused orbs, adapted from Substrate's kind profile
# (manifests/ate-install/kind/rustfs.yaml). Lives in ate-system so the runtime reaches it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rustfs-data, namespace: ate-system}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 200Gi}} # K3s local-path does not enforce this; it is a label
---
apiVersion: v1
kind: Service
metadata: {name: rustfs, namespace: ate-system}
spec:
  selector: {app: rustfs}
  ports: [{name: api, port: 9000, targetPort: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rustfs, namespace: ate-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: rustfs}}
  template:
    metadata: {labels: {app: rustfs}}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        ports: [{containerPort: 9000, name: api}]
        env:
        - {name: RUSTFS_ADDRESS, value: ":9000"}
        - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
        - {name: RUSTFS_VOLUMES, value: /data}
        - {name: RUSTFS_ACCESS_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_ACCESS_KEY_ID}}}
        - {name: RUSTFS_SECRET_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_SECRET_ACCESS_KEY}}}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: rustfs-data}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: rustfs-bucket-init, namespace: ate-system}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-bucket
        image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
        env:
        - {name: AWS_REGION, value: us-east-1}
        - {name: AWS_ENDPOINT_URL, value: "http://rustfs.ate-system.svc:9000"}
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_SECRET_ACCESS_KEY}}}
        command: [/bin/sh, -c]
        args:
        - |
          for i in $(seq 1 60); do
            aws s3api head-bucket --bucket amp-orbs 2>/dev/null && exit 0
            aws s3api create-bucket --bucket amp-orbs 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
---
# ate-system denies ingress by default; let only the runtime and the init job in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rustfs, namespace: ate-system}
spec:
  podSelector: {matchLabels: {app: rustfs}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [ate-api-server, atelet]}]}
    - podSelector: {matchLabels: {batch.kubernetes.io/job-name: rustfs-bucket-init}}
    ports: [{protocol: TCP, port: api}]
