# Helm post-renderer overlay: Amp's orb-provider chart (cloud=eks) shrunk for a small K3s cluster.
# Kustomize skips a patch whose target matches nothing, so where it can, this overlay fails the
# render instead when a new chart renames or moves what it patches: `test` ops in JSON patches,
# the `replicas` list, and strategic merges without a target. Strategic merges move the list
# items they patch to the front, so they are used only where that item is already first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - all.yaml # the chart's rendered output, written by post-render.sh
  - versitygw.yaml
secretGenerator:
  - name: orb-snapshots-s3
    namespace: ate-system
    envs: [s3.env]
    options: {disableNameSuffixHash: true}
  - name: orb-snapshots-key # encrypts the snapshot store; see README, Snapshot encryption
    namespace: ate-system
    files: [snapshots.key]
    options: {disableNameSuffixHash: true}
# A server much bigger than the agents: run the shared services on it (see README, Sizing).
# components:
#   - server-node
replicas:
  - {name: ate-api-server, count: 1}
  - {name: ate-idp-server, count: 1}
patches:
  - path: provider-patch.yaml
    target: {kind: Deployment, name: amp-orb-provider, namespace: amp-orbs}
  # Paused orbs on a NAS instead of a local volume: set the export in nas-patch.yaml and uncomment.
  # - path: nas-patch.yaml
  - target: {kind: StatefulSet, name: postgres, namespace: ate-system}
    patch: |-
      - {op: test, path: /spec/volumeClaimTemplates/0/metadata/name, value: data}
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 5Gi}
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: postgres, namespace: ate-system}
      spec:
        template:
          spec:
            containers:
            - name: postgres
              resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 1Gi}}
            # Since chart 0.20261109 the podcert-agent image runs as uid 65532, so it writes the TLS key
            # 0640 owned by 65532, and Postgres refuses to start ("private key file ... must be owned by
            # the database user or root"). Run it as root, as the earlier image did.
            initContainers:
            - name: podcert-agent
              securityContext: {runAsUser: 0}
  # These containers request no CPU, so when busy orbs fill the node's CPU they get almost none of
  # it, and spawns, the API and orbs' egress time out. Requests give them a share (350m in total).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ate-api-server, namespace: ate-system}
      spec: {template: {spec: {containers: [{name: ate-api-server, resources: {requests: {cpu: 100m}}}]}}}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: atenet-router, namespace: ate-system}
      spec: {template: {spec: {containers: [{name: atenet-router, resources: {requests: {cpu: 50m}}}, {name: envoy, resources: {requests: {cpu: 50m}}}]}}}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: atenet-egress, namespace: ate-system}
      spec: {template: {spec: {containers: [{name: envoy, resources: {requests: {cpu: 50m}}}, {name: ext-proc, resources: {requests: {cpu: 50m}}}]}}}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ate-controller, namespace: ate-system}
      spec: {template: {spec: {containers: [{name: ate-controller, resources: {requests: {cpu: 25m}}}]}}}
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ate-idp-server, namespace: ate-system}
      spec: {template: {spec: {containers: [{name: ate-idp-server, resources: {requests: {cpu: 25m}}}]}}}
  # atelet: K3s nodes have no EKS image credential provider, so drop its args and host mounts (as
  # Substrate's kind overlay does) and pull the public images anonymously. Then the snapshot
  # upload limit and the local copy's lifetime (see README, Snapshot timing). The objectstore
  # plugin compresses uploads and decompresses downloads, so it gets a CPU share for busy nodes.
  - target: {kind: DaemonSet, name: atelet, namespace: ate-system}
    patch: |-
      - {op: test, path: /spec/template/spec/initContainers/1/name, value: objectstore-plugin}
      - {op: test, path: /spec/template/spec/initContainers/1/resources/requests/cpu, value: 50m}
      - {op: replace, path: /spec/template/spec/initContainers/1/resources/requests/cpu, value: 100m}
      # The plugin gives up on a snapshot download after the AWS SDK's default 3 attempts (about
      # 6 s), and a failed restore marks the orb crashed, which the provider then deletes with its
      # snapshots. 20 attempts, backing off up to 20 s each, outlast a gateway or NAS restart.
      - {op: add, path: /spec/template/spec/initContainers/1/env/-, value: {name: AWS_MAX_ATTEMPTS, value: "20"}}
      - {op: test, path: /spec/template/spec/containers/0/name, value: atelet}
      - {op: test, path: /spec/template/spec/containers/0/args/0, value: "--image-credential-provider-config=/run/image-credential-provider/config.yaml"}
      - {op: test, path: /spec/template/spec/containers/0/args/1, value: "--image-credential-provider-bin-dir=/run/image-credential-provider/bin"}
      - {op: remove, path: /spec/template/spec/containers/0/args/1}
      - {op: remove, path: /spec/template/spec/containers/0/args/0}
      - {op: test, path: /spec/template/spec/containers/0/volumeMounts/7/name, value: image-credential-provider-bin}
      - {op: test, path: /spec/template/spec/containers/0/volumeMounts/8/name, value: image-credential-provider-config}
      - {op: remove, path: /spec/template/spec/containers/0/volumeMounts/8}
      - {op: remove, path: /spec/template/spec/containers/0/volumeMounts/7}
      - {op: test, path: /spec/template/spec/volumes/4/name, value: image-credential-provider-bin}
      - {op: test, path: /spec/template/spec/volumes/5/name, value: image-credential-provider-config}
      - {op: remove, path: /spec/template/spec/volumes/5}
      - {op: remove, path: /spec/template/spec/volumes/4}
      - {op: add, path: /spec/template/spec/containers/0/args/-, value: "--snapshot-upload-timeout=3m"}
      - {op: add, path: /spec/template/spec/containers/0/args/-, value: "--snapshot-upload-est-throughput-mib=5"}
      # One upload at a time: uploads share the plugin's 512 MiB buffer budget, and a second one
      # waits there on the clock, behind the first one's memory image, until its deadline passes.
      - {op: add, path: /spec/template/spec/containers/0/args/-, value: "--snapshot-upload-workers=1"}
      - {op: add, path: /spec/template/spec/containers/0/args/-, value: "--snapshot-detach-delay=24h"}
  # Snapshots go to the in-cluster S3 gateway (versitygw.yaml) instead of AWS S3.
  - target: {kind: DaemonSet|Deployment, name: atelet|ate-api-server, namespace: ate-system}
    patch: |-
      - {op: test, path: /spec/template/spec/initContainers/1/name, value: objectstore-plugin}
      - {op: add, path: /spec/template/spec/initContainers/1/env/-, value: {name: AWS_ENDPOINT_URL, value: "http://versitygw.ate-system.svc:7070"}}
      - {op: add, path: /spec/template/spec/initContainers/1/env/-, value: {name: AWS_S3_USE_PATH_STYLE, value: "true"}}
      - {op: add, path: /spec/template/spec/initContainers/1/env/-, value: {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_ACCESS_KEY_ID}}}}
      - {op: add, path: /spec/template/spec/initContainers/1/env/-, value: {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_SECRET_ACCESS_KEY}}}}
