# For a cluster with one server much bigger than its agents (see README, Sizing): put the shared
# services on the K3s server, so the agents' CPU goes to orbs, and give the snapshot gateway the
# CPU a busy server can spare. Enable it in ../kustomization.yaml under components.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # K3s labels its servers with this. Preferred, not required: if the server is full or down for
  # good, they still run elsewhere. Postgres keeps its local volume on the node it first runs on.
  - target:
      kind: Deployment|StatefulSet
      namespace: amp-orbs|ate-system|otel-system|podcertificate-controller-system
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - {key: node-role.kubernetes.io/control-plane, operator: In, values: ["true"]}
  # In a wake of 3 orbs from the NAS, the gateway used about 1 core, and the node ran out of CPU.
  - target: {kind: Deployment, name: versitygw, namespace: ate-system}
    patch: |-
      - {op: test, path: /spec/template/spec/containers/0/name, value: versitygw}
      - {op: test, path: /spec/template/spec/containers/0/resources/requests/cpu, value: 250m}
      - {op: replace, path: /spec/template/spec/containers/0/resources/requests/cpu, value: "1"}
