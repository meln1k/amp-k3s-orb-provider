# S3 for paused orbs: Versity S3 Gateway with its POSIX backend, which stores each object as a
# plain file under /data, so /data can be a local disk or an NFS share on a NAS (see README).
# Lives in ate-system so the runtime reaches it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: snapshots-data, namespace: ate-system}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 200Gi}} # K3s local-path does not enforce this; it is a label
---
apiVersion: v1
kind: Service
metadata: {name: versitygw, namespace: ate-system}
spec:
  selector: {app: versitygw}
  ports: [{name: api, port: 7070, targetPort: 7070}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: versitygw, namespace: ate-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: versitygw}}
  template:
    metadata: {labels: {app: versitygw}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
      - name: versitygw
        image: versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
        args: [--port, ":7070", posix, /data]
        ports: [{containerPort: 7070, name: api}]
        env:
        - {name: ROOT_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_ACCESS_KEY_ID}}}
        - {name: ROOT_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_SECRET_ACCESS_KEY}}}
        # Object metadata goes in extended attributes on /data. If /data is a share without
        # them (NFS before 4.2, or SMB), set this and mount a second volume at /meta, such as
        # another directory on the same share. Versity calls this mode experimental.
        # - {name: VGW_META_SIDECAR, value: /meta}
        readinessProbe: {tcpSocket: {port: api}, periodSeconds: 5}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: snapshots-data}
        # A NAS export instead (every node needs nfs-common; the export must be writable by uid 1000):
        # nfs: {server: nas.lan, path: /volume1/amp-orbs}
---
apiVersion: batch/v1
kind: Job
metadata: {name: snapshots-bucket-init, namespace: ate-system}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: create-bucket
        image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
        env:
        - {name: AWS_REGION, value: us-east-1}
        - {name: AWS_ENDPOINT_URL, value: "http://versitygw.ate-system.svc:7070"}
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_ACCESS_KEY_ID}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_SECRET_ACCESS_KEY}}}
        command: [/bin/sh, -c]
        args:
        - |
          for i in $(seq 1 60); do
            aws s3api head-bucket --bucket amp-orbs 2>/dev/null && exit 0
            aws s3api create-bucket --bucket amp-orbs 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
---
# ate-system denies ingress by default; let only the runtime and the init job in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: versitygw, namespace: ate-system}
spec:
  podSelector: {matchLabels: {app: versitygw}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [ate-api-server, atelet]}]}
    - podSelector: {matchLabels: {batch.kubernetes.io/job-name: snapshots-bucket-init}}
    ports: [{protocol: TCP, port: api}]
