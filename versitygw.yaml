# S3 for paused orbs: Versity S3 Gateway with its POSIX backend, which stores each object as a
# plain file under /data, on a local volume or, with nas-patch.yaml, an NFS export.
# Lives in ate-system so the runtime reaches it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: snapshots-data, namespace: ate-system}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 200Gi}} # K3s local-path does not enforce this; it is a label
---
apiVersion: v1
kind: Service
metadata: {name: versitygw, namespace: ate-system}
spec:
  selector: {app: versitygw}
  ports: [{name: api, port: 7070, targetPort: 7070}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: versitygw, namespace: ate-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: versitygw}}
  template:
    metadata: {labels: {app: versitygw}}
    spec:
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      initContainers:
      # The POSIX backend serves each top-level directory as a bucket. The chart stores snapshots
      # under gs://amp-orbs/orbs/, so the amp-orbs directory is the whole bucket setup.
      - name: create-bucket
        image: versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
        command: [mkdir, -p, /data/amp-orbs]
        volumeMounts: [{name: data, mountPath: /data, subPath: data}]
      containers:
      - name: versitygw
        image: versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5
        args: [--port, ":7070", posix, /data]
        ports: [{containerPort: 7070, name: api}]
        env:
        - {name: ROOT_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_ACCESS_KEY_ID}}}
        - {name: ROOT_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: orb-snapshots-s3, key: AWS_SECRET_ACCESS_KEY}}}
        readinessProbe: {tcpSocket: {port: api}, periodSeconds: 5}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 512Mi}}
        volumeMounts:
        - {name: data, mountPath: /data, subPath: data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: snapshots-data}
---
# ate-system denies ingress by default; let only the runtime in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: versitygw, namespace: ate-system}
spec:
  podSelector: {matchLabels: {app: versitygw}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [ate-api-server, atelet]}]}
    ports: [{protocol: TCP, port: api}]
