# EXPERIMENTAL. JSON patch for the amp-orb-provider Deployment: run orbs as microVMs with memory
# snapshots. Amp's provider hardcodes the sandbox class and snapshot settings in its bundle, so
# the provider container patches its own main.js at start: it copies the bundle to an emptyDir,
# replaces exact strings, and refuses to start if any is not found exactly once (a new chart moved
# it). Checked against chart 0.20261109.1946.
- {op: test, path: /spec/template/spec/initContainers/2/name, value: provider}
# The worker image: Substrate's ateworker-microvm, built from the commit the chart's
# ateworker-gvisor comes from, reproducibly (see microvm/README.md to rebuild and check the
# digest). The provider only accepts a digest-pinned image.
- {op: test, path: /spec/template/spec/initContainers/2/env/15/name, value: WORKER_IMAGE}
- {op: replace, path: /spec/template/spec/initContainers/2/env/15/value, value: "ghcr.io/meln1k/substrate/ateworker-microvm@sha256:9f3dcecdb737c330db4479605f51be422c9b388e989dc5c1073cb56ffed77756"}
- {op: add, path: /spec/template/spec/volumes/-, value: {name: provider-patched, emptyDir: {}}}
- {op: add, path: /spec/template/spec/initContainers/2/volumeMounts/-, value: {name: provider-patched, mountPath: /opt/amp-orb-provider-patched}}
- op: add
  path: /spec/template/spec/initContainers/2/command
  value:
  - node
  - --input-type=module
  - -e
  - |
    import {readFileSync, writeFileSync, copyFileSync} from 'node:fs'
    const src = '/opt/amp-orb-provider', dst = '/opt/amp-orb-provider-patched'
    const patches = [
      // WorkerPools: the microvm class, on nodes labelled ate.dev/sandboxClass=microvm.
      ['sandboxClasses:[{name:"gvisor"}]', 'sandboxClasses:[{name:"microvm"}]'],
      [']:"gvisor"}', ']:"microvm"}'],
      ['operator:"Equal",value:"gvisor"', 'operator:"Equal",value:"microvm"'],
      // Pauses save process memory too, so processes keep running after a resume.
      ['preferredFidelity:"SNAPSHOT_FIDELITY_ROOTFS"', 'preferredFidelity:"SNAPSHOT_FIDELITY_MEMORY"'],
      // A pause returns once the snapshot is on the node; the upload continues in the background.
      ['{durable:"DURABILITY_MODE_SYNCHRONOUS",', '{durable:"DURABILITY_MODE_ASYNCHRONOUS",'],
    ]
    let js = readFileSync(`${src}/main.js`, 'utf8')
    for (const [from, to] of patches) {
      const n = js.split(from).length - 1
      if (n !== 1) { console.error(`k3s patch: found ${n} times, expected 1: ${from}`); process.exit(1) }
      js = js.replace(from, to)
    }
    writeFileSync(`${dst}/main.js`, js)
    copyFileSync(`${src}/ateapi.proto`, `${dst}/ateapi.proto`)
    console.error(`k3s patch: applied ${patches.length} provider patches`)
    await import(`${dst}/main.js`)
